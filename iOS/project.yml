name: CoinjarChangeTracker
options:
  bundleIdPrefix: com.shimondeitel.coinjarapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  CoinjarChangeTracker:
    type: application
    platform: iOS
    sources:
      - path: CoinjarChangeTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.coinjarapp
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: CoinjarChangeTracker/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  CoinjarChangeTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoinjarChangeTrackerTests
      - path: CoinjarChangeTracker.storekit
    dependencies:
      - target: CoinjarChangeTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.coinjarapp.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  CoinjarChangeTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CoinjarChangeTrackerUITests
    dependencies:
      - target: CoinjarChangeTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.coinjarapp.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  CoinjarChangeTracker:
    build:
      targets:
        CoinjarChangeTracker: all
        CoinjarChangeTrackerTests: [test]
        CoinjarChangeTrackerUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: CoinjarChangeTracker.storekit
    test:
      config: Debug
      storeKitConfiguration: CoinjarChangeTracker.storekit
      targets:
        - CoinjarChangeTrackerTests
        - CoinjarChangeTrackerUITests
    archive:
      config: Release
